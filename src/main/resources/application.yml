spring:
  application:
    name: gw-branch

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: ms-auth-kyc
              uri: lb://ms-auth-kyc
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            - id: ms-account
              uri: lb://ms-account
              predicates:
                - Path=/account/**
              filters:
                - StripPrefix=1

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/pin-realm

server:
  port: 8020

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway