spring:
  application:
    name: gw-branch
  config:
    import: "classpath:application-vault.yml,vault://"

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: ms-auth-kyc
              uri: lb://ms-auth-kyc
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            - id: ms-account
              uri: lb://ms-account
              predicates:
                - Path=/account/**
              filters:
                - StripPrefix=1

            - id: ms-document
              uri: lb://ms-document
              predicates:
                - Path=/document/**
              filters:
                - StripPrefix=1

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${issuer-uri}

server:
  port: 8020

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${eureka-server}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway